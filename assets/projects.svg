<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid meet" role="img">
  <title>Proyectos &#183; Deploy Board &#183; Jean Pierre FM</title>

  <defs>
    <clipPath id="pr-clip">
      <rect x="0" y="0" width="1200" height="360" rx="18"/>
    </clipPath>

    <pattern id="pr-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>

    <pattern id="pr-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#F8FAFC"/>
    </pattern>

    <linearGradient id="pr-titleGrad" gradientUnits="userSpaceOnUse" x1="64" y1="70" x2="320" y2="92">
      <stop offset="0"   stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#D946EF"/>
      <stop offset="0.8" stop-color="#E879F9"/>
      <stop offset="1"   stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="pr-shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0" spreadMethod="pad">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-420 0; 1320 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="pr-scanPulse" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="0" spreadMethod="pad">
      <stop offset="0"   stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D946EF" stop-opacity="0.9"/>
      <stop offset="1"   stop-color="#38BDF8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-220 0; 1320 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="pr-glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pr-glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#A855F7" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#D946EF" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pr-sweepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="1"   stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <filter id="pr-textglow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#A855F7" flood-opacity="0.5"/>
    </filter>

    <filter id="pr-dotglow" x="-120%" y="-120%" width="340%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#A855F7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g clip-path="url(#pr-clip)">
    <!-- Fondo -->
    <rect x="0" y="0" width="1200" height="360" rx="18" fill="#0D1117"/>
    <rect x="0" y="0" width="1200" height="360" fill="url(#pr-grid)" opacity="0.55"/>
    <rect x="0" y="0" width="1200" height="360" fill="url(#pr-scan)" opacity="0.025"/>

    <!-- Glows ambientales -->
    <ellipse cx="300" cy="200" rx="360" ry="170" fill="url(#pr-glowL)"/>
    <circle cx="980" cy="110" r="190" fill="url(#pr-glowR)"/>

    <!-- Barrido vertical tenue -->
    <rect x="0" y="-140" width="1200" height="140" fill="url(#pr-sweepGrad)" opacity="0.06">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 530" dur="13s" repeatCount="indefinite"/>
    </rect>

    <!-- Cabecera: prompt HUD -->
    <text x="64" y="46" font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="15">
      <tspan fill="#A855F7">~/deploys</tspan><tspan fill="#22C55E"> $ </tspan><tspan fill="#38BDF8">status</tspan><tspan fill="#94A3B8"> --watch</tspan>
    </text>
    <rect x="290" y="33" width="9" height="16" fill="#A855F7">
      <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>

    <!-- Mini-titulo con gradiente -->
    <text x="64" y="88" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="30" font-weight="800" letter-spacing="0.5"
          fill="url(#pr-titleGrad)" filter="url(#pr-textglow)">Proyectos</text>
    <text x="64" y="88" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="30" font-weight="800" letter-spacing="0.5"
          fill="url(#pr-shimmer)">Proyectos</text>

    <!-- Encabezados de columna -->
    <g font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="10"
       fill="#64748B" letter-spacing="2">
      <text x="92"   y="104">SERVICIO</text>
      <text x="255"  y="104">DESCRIPCI&#211;N</text>
      <text x="620"  y="104">STACK</text>
      <text x="1136" y="104" text-anchor="end">ESTADO</text>
    </g>

    <!-- Separador de cabecera + scan de actividad -->
    <line x1="56" y1="112" x2="1144" y2="112" stroke="#1E293B" stroke-width="1"/>
    <rect x="56" y="111" width="1088" height="2" fill="url(#pr-scanPulse)" opacity="0.8"/>

    <!-- Separadores de filas -->
    <g stroke="#1E293B" stroke-width="1" opacity="0.7">
      <line x1="56" y1="154" x2="1144" y2="154"/>
      <line x1="56" y1="196" x2="1144" y2="196"/>
      <line x1="56" y1="238" x2="1144" y2="238"/>
      <line x1="56" y1="280" x2="1144" y2="280"/>
    </g>

    <!-- FILA 1 &#183; Aurum-Loans &#183; live -->
    <g>
      <circle cx="72" cy="133" r="5" fill="#22C55E" opacity="0.25">
        <animate attributeName="r" values="5;11;5" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="72" cy="133" r="4.5" fill="#22C55E" filter="url(#pr-dotglow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="92" y="138" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
            font-size="15.5" font-weight="700" fill="#F8FAFC">Aurum-Loans</text>
      <text x="255" y="138" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
            font-size="13" fill="#94A3B8">Pr&#233;stamos: motor de amortizaci&#243;n en el edge</text>
      <g font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="11">
        <rect x="620" y="122" width="45" height="22" rx="6" fill="#A855F7" fill-opacity="0.08"
              stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
        <text x="642.5" y="137" text-anchor="middle" fill="#C4B5FD">Hono</text>
        <rect x="673" y="122" width="65" height="22" rx="6" fill="#38BDF8" fill-opacity="0.07"
              stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
        <text x="705.5" y="137" text-anchor="middle" fill="#38BDF8">Workers</text>
        <rect x="746" y="122" width="51" height="22" rx="6" fill="#A855F7" fill-opacity="0.08"
              stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
        <text x="771.5" y="137" text-anchor="middle" fill="#C4B5FD">React</text>
        <rect x="805" y="122" width="71" height="22" rx="6" fill="#38BDF8" fill-opacity="0.07"
              stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
        <text x="840.5" y="137" text-anchor="middle" fill="#38BDF8">Supabase</text>
      </g>
      <rect x="1062" y="121" width="74" height="24" rx="12" fill="#22C55E" fill-opacity="0.08"
            stroke="#22C55E" stroke-opacity="0.45" stroke-width="1"/>
      <text x="1099" y="137" text-anchor="middle" fill="#22C55E"
            font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="12">live</text>
    </g>

    <!-- FILA 2 &#183; MonkeyFit &#183; live -->
    <g>
      <circle cx="72" cy="175" r="5" fill="#22C55E" opacity="0.25">
        <animate attributeName="r" values="5;11;5" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="72" cy="175" r="4.5" fill="#22C55E" filter="url(#pr-dotglow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="92" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
            font-size="15.5" font-weight="700" fill="#F8FAFC">MonkeyFit</text>
      <text x="255" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
            font-size="13" fill="#94A3B8">Agente IA de WhatsApp para gimnasios</text>
      <g font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="11">
        <rect x="620" y="164" width="65" height="22" rx="6" fill="#A855F7" fill-opacity="0.08"
              stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
        <text x="652.5" y="179" text-anchor="middle" fill="#C4B5FD">FastAPI</text>
        <rect x="693" y="164" width="78" height="22" rx="6" fill="#38BDF8" fill-opacity="0.07"
              stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
        <text x="732" y="179" text-anchor="middle" fill="#38BDF8">LangGraph</text>
        <rect x="779" y="164" width="58" height="22" rx="6" fill="#A855F7" fill-opacity="0.08"
              stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
        <text x="808" y="179" text-anchor="middle" fill="#C4B5FD">Gemini</text>
      </g>
      <rect x="1062" y="163" width="74" height="24" rx="12" fill="#22C55E" fill-opacity="0.08"
            stroke="#22C55E" stroke-opacity="0.45" stroke-width="1"/>
      <text x="1099" y="179" text-anchor="middle" fill="#22C55E"
            font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="12">live</text>
    </g>

    <!-- FILA 3 &#183; Fito-tagger &#183; live -->
    <g>
      <circle cx="72" cy="217" r="5" fill="#22C55E" opacity="0.25">
        <animate attributeName="r" values="5;11;5" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="72" cy="217" r="4.5" fill="#22C55E" filter="url(#pr-dotglow)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="92" y="222" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
            font-size="15.5" font-weight="700" fill="#F8FAFC">Fito-tagger</text>
      <text x="255" y="222" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
            font-size="13" fill="#94A3B8">Tagging masivo de productos (BigQuery)</text>
      <g font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="11">
        <rect x="620" y="206" width="65" height="22" rx="6" fill="#A855F7" fill-opacity="0.08"
              stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
        <text x="652.5" y="221" text-anchor="middle" fill="#C4B5FD">Express</text>
        <rect x="693" y="206" width="71" height="22" rx="6" fill="#38BDF8" fill-opacity="0.07"
              stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
        <text x="728.5" y="221" text-anchor="middle" fill="#38BDF8">BigQuery</text>
        <rect x="772" y="206" width="78" height="22" rx="6" fill="#A855F7" fill-opacity="0.08"
              stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
        <text x="811" y="221" text-anchor="middle" fill="#C4B5FD">Cloud Run</text>
      </g>
      <rect x="1062" y="205" width="74" height="24" rx="12" fill="#22C55E" fill-opacity="0.08"
            stroke="#22C55E" stroke-opacity="0.45" stroke-width="1"/>
      <text x="1099" y="221" text-anchor="middle" fill="#22C55E"
            font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="12">live</text>
    </g>

    <!-- FILA 4 &#183; Prisma-TCG &#183; ready -->
    <g>
      <circle cx="72" cy="259" r="5" fill="#F59E0B" opacity="0.25">
        <animate attributeName="r" values="5;11;5" dur="2.8s" begin="-0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35" dur="2.8s" begin="-0.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="72" cy="259" r="4.5" fill="#F59E0B" filter="url(#pr-dotglow)">
        <animate attributeName="opacity" values="0.65;1;0.65" dur="2.8s" begin="-0.4s" repeatCount="indefinite"/>
      </circle>
      <text x="92" y="264" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
            font-size="15.5" font-weight="700" fill="#F8FAFC">Prisma-TCG</text>
      <text x="255" y="264" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
            font-size="13" fill="#94A3B8">Inventario Pok&#233;mon TCG + sociedad</text>
      <g font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="11">
        <rect x="620" y="248" width="45" height="22" rx="6" fill="#A855F7" fill-opacity="0.08"
              stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
        <text x="642.5" y="263" text-anchor="middle" fill="#C4B5FD">Hono</text>
        <rect x="673" y="248" width="65" height="22" rx="6" fill="#38BDF8" fill-opacity="0.07"
              stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
        <text x="705.5" y="263" text-anchor="middle" fill="#38BDF8">Workers</text>
        <rect x="746" y="248" width="71" height="22" rx="6" fill="#A855F7" fill-opacity="0.08"
              stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
        <text x="781.5" y="263" text-anchor="middle" fill="#C4B5FD">Supabase</text>
      </g>
      <rect x="1062" y="247" width="74" height="24" rx="12" fill="#F59E0B" fill-opacity="0.08"
            stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1"/>
      <text x="1099" y="263" text-anchor="middle" fill="#F59E0B"
            font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="12">ready</text>
    </g>

    <!-- FILA 5 &#183; Odin &#183; dev -->
    <g>
      <circle cx="72" cy="301" r="5" fill="#A855F7" opacity="0.25">
        <animate attributeName="r" values="5;11;5" dur="3.2s" begin="-1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0;0.35" dur="3.2s" begin="-1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="72" cy="301" r="4.5" fill="#A855F7" filter="url(#pr-dotglow)">
        <animate attributeName="opacity" values="0.65;1;0.65" dur="3.2s" begin="-1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="92" y="306" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
            font-size="15.5" font-weight="700" fill="#F8FAFC">Odin</text>
      <text x="255" y="306" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
            font-size="13" fill="#94A3B8">Plataforma de delivery (5 apps)</text>
      <g font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="11">
        <rect x="620" y="290" width="58" height="22" rx="6" fill="#A855F7" fill-opacity="0.08"
              stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
        <text x="649" y="305" text-anchor="middle" fill="#C4B5FD">NestJS</text>
        <rect x="686" y="290" width="45" height="22" rx="6" fill="#38BDF8" fill-opacity="0.07"
              stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
        <text x="708.5" y="305" text-anchor="middle" fill="#38BDF8">Expo</text>
        <rect x="739" y="290" width="58" height="22" rx="6" fill="#A855F7" fill-opacity="0.08"
              stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
        <text x="768" y="305" text-anchor="middle" fill="#C4B5FD">Prisma</text>
        <rect x="805" y="290" width="52" height="22" rx="6" fill="#38BDF8" fill-opacity="0.07"
              stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
        <text x="831" y="305" text-anchor="middle" fill="#38BDF8">Redis</text>
      </g>
      <rect x="1062" y="289" width="74" height="24" rx="12" fill="#A855F7" fill-opacity="0.08"
            stroke="#A855F7" stroke-opacity="0.45" stroke-width="1"/>
      <text x="1099" y="305" text-anchor="middle" fill="#A855F7"
            font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="12">dev</text>
    </g>

    <!-- Marco HUD: corchetes de esquina -->
    <g fill="none" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.35;0.62;0.35" dur="4.5s" repeatCount="indefinite"/>
      <path d="M26 54 L26 34 Q26 26 34 26 L54 26"/>
      <path d="M1146 26 L1166 26 Q1174 26 1174 34 L1174 54"/>
      <path d="M1174 306 L1174 326 Q1174 334 1166 334 L1146 334"/>
      <path d="M54 334 L34 334 Q26 334 26 326 L26 306"/>
    </g>
  </g>
</svg>
