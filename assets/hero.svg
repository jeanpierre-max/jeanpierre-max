<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="img">
  <title>Jean Pierre FM &#183; Desarrollador Full-Stack Jr</title>

  <defs>
    <clipPath id="hd-clip">
      <rect x="0" y="0" width="1200" height="300" rx="18"/>
    </clipPath>

    <pattern id="hd-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>

    <pattern id="hd-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#F8FAFC"/>
    </pattern>

    <linearGradient id="hd-nameGrad" gradientUnits="userSpaceOnUse" x1="64" y1="120" x2="600" y2="150">
      <stop offset="0"   stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#D946EF"/>
      <stop offset="0.8" stop-color="#E879F9"/>
      <stop offset="1"   stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="hd-shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0" spreadMethod="pad">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-420 0; 1320 0" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="hd-glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hd-glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="0.7" stop-color="#D946EF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hd-sweepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="1"   stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <filter id="hd-textglow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#A855F7" flood-opacity="0.5"/>
    </filter>

    <filter id="hd-lineglow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#A855F7" flood-opacity="0.65"/>
    </filter>

    <path id="hd-orbit"    d="M 832 152 a 128 38 0 1 0 256 0 a 128 38 0 1 0 -256 0"/>
    <path id="hd-orbitRev" d="M 832 152 a 128 38 0 1 1 256 0 a 128 38 0 1 1 -256 0"/>
  </defs>

  <g clip-path="url(#hd-clip)">
    <!-- Fondo -->
    <rect x="0" y="0" width="1200" height="300" rx="18" fill="#0D1117"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#hd-grid)" opacity="0.55"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#hd-scan)" opacity="0.025"/>

    <!-- Glows ambientales -->
    <ellipse cx="320" cy="140" rx="340" ry="150" fill="url(#hd-glowL)"/>
    <circle cx="960" cy="152" r="160" fill="url(#hd-glowR)"/>

    <!-- Barrido vertical tenue -->
    <rect x="0" y="-140" width="1200" height="140" fill="url(#hd-sweepGrad)" opacity="0.07">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 470" dur="12s" repeatCount="indefinite"/>
    </rect>

    <!-- Estrellas / constelacion de fondo -->
    <g fill="#C4B5FD">
      <circle cx="775"  cy="86"  r="1.4">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1128" cy="74"  r="1.2" fill="#38BDF8">
        <animate attributeName="opacity" values="0.75;0.2;0.75" dur="4.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="806"  cy="234" r="1.3">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.9s" begin="-1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1142" cy="212" r="1.1" fill="#38BDF8">
        <animate attributeName="opacity" values="0.25;0.8;0.25" dur="3.8s" begin="-2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="762"  cy="160" r="1.2">
        <animate attributeName="opacity" values="0.8;0.25;0.8" dur="3.1s" begin="-0.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ESFERA WIREFRAME (derecha) -->
    <g transform="rotate(-14 960 152)" filter="url(#hd-lineglow)" fill="none">
      <!-- contorno -->
      <circle cx="960" cy="152" r="88" stroke="#C4B5FD" stroke-width="1.6" opacity="0.7"/>
      <!-- latitudes -->
      <ellipse cx="960" cy="152" rx="88" ry="18" stroke="#A855F7" stroke-width="1.2" opacity="0.55"/>
      <ellipse cx="960" cy="108" rx="76" ry="15" stroke="#A855F7" stroke-width="1.1" opacity="0.45"/>
      <ellipse cx="960" cy="196" rx="76" ry="15" stroke="#A855F7" stroke-width="1.1" opacity="0.45"/>
      <ellipse cx="960" cy="76"  rx="44" ry="9"  stroke="#A855F7" stroke-width="1"   opacity="0.35"/>
      <ellipse cx="960" cy="228" rx="44" ry="9"  stroke="#A855F7" stroke-width="1"   opacity="0.35"/>
      <!-- meridianos rotando -->
      <ellipse cx="960" cy="152" rx="88" ry="88" stroke="#D946EF" stroke-width="1.3">
        <animate attributeName="rx" values="88;4;88" dur="10s" repeatCount="indefinite"
                 calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="opacity" values="0.8;0.25;0.8" dur="10s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="960" cy="152" rx="88" ry="88" stroke="#A855F7" stroke-width="1.3">
        <animate attributeName="rx" values="88;4;88" dur="10s" begin="-3.33s" repeatCount="indefinite"
                 calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="opacity" values="0.8;0.25;0.8" dur="10s" begin="-3.33s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="960" cy="152" rx="88" ry="88" stroke="#E879F9" stroke-width="1.3">
        <animate attributeName="rx" values="88;4;88" dur="10s" begin="-6.66s" repeatCount="indefinite"
                 calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="opacity" values="0.8;0.25;0.8" dur="10s" begin="-6.66s" repeatCount="indefinite"/>
      </ellipse>
      <!-- vertices latientes -->
      <g stroke="none">
        <circle cx="960"  cy="64"  r="2.4" fill="#E879F9">
          <animate attributeName="r" values="2;3.6;2" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1048" cy="152" r="2.4" fill="#C4B5FD">
          <animate attributeName="r" values="2;3.6;2" dur="3s" begin="-0.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="-0.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="872"  cy="152" r="2.4" fill="#A855F7">
          <animate attributeName="r" values="2;3.6;2" dur="3s" begin="-1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="-1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="884"  cy="108" r="2" fill="#38BDF8">
          <animate attributeName="r" values="1.7;3;1.7" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1036" cy="196" r="2" fill="#E879F9">
          <animate attributeName="r" values="1.7;3;1.7" dur="3s" begin="-2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="-2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="960"  cy="240" r="2.4" fill="#C4B5FD">
          <animate attributeName="r" values="2;3.6;2" dur="3s" begin="-2.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" begin="-2.5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Anillo orbital con particulas -->
    <g transform="rotate(-18 960 152)">
      <ellipse cx="960" cy="152" rx="128" ry="38" fill="none" stroke="#A855F7"
               stroke-width="1" stroke-dasharray="3 7" opacity="0.3"/>
      <circle r="3.2" fill="#E879F9" filter="url(#hd-lineglow)">
        <animateMotion dur="9s" repeatCount="indefinite" rotate="0">
          <mpath xlink:href="#hd-orbit"/>
        </animateMotion>
      </circle>
      <circle r="2.2" fill="#38BDF8" filter="url(#hd-lineglow)">
        <animateMotion dur="13s" repeatCount="indefinite" rotate="0">
          <mpath xlink:href="#hd-orbitRev"/>
        </animateMotion>
      </circle>
    </g>

    <!-- Linea prompt -->
    <text x="64" y="52" font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="15">
      <tspan fill="#A855F7">~/jeanpierre-max</tspan><tspan fill="#22C55E"> $ </tspan><tspan fill="#38BDF8">init</tspan><tspan fill="#94A3B8"> --profile</tspan>
    </text>
    <rect x="342" y="39" width="9" height="16" fill="#A855F7">
      <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>

    <!-- NOMBRE GIGANTE -->
    <text x="64" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="62" font-weight="800" letter-spacing="0.5"
          fill="url(#hd-nameGrad)" filter="url(#hd-textglow)">Jean Pierre FM</text>
    <text x="64" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="62" font-weight="800" letter-spacing="0.5"
          fill="url(#hd-shimmer)">Jean Pierre FM</text>

    <!-- Subtitulo -->
    <text x="64" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17">
      <tspan fill="#C4B5FD">Full-Stack Jr</tspan><tspan fill="#A855F7"> &#183; </tspan><tspan fill="#C4B5FD">Dise&#241;o</tspan><tspan fill="#A855F7"> &#183; </tspan><tspan fill="#C4B5FD">IA</tspan><tspan fill="#A855F7"> &#183; </tspan><tspan fill="#94A3B8">Chimbote, Peru</tspan>
    </text>

    <!-- Linea de codigo con syntax highlighting -->
    <text x="64" y="230" font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="16">
      <tspan fill="#A855F7" font-weight="bold">const</tspan><tspan fill="#F8FAFC"> focus </tspan><tspan fill="#64748B">= [</tspan><tspan fill="#38BDF8">&quot;Apps con IA&quot;</tspan><tspan fill="#64748B">, </tspan><tspan fill="#38BDF8">&quot;Edge Backends&quot;</tspan><tspan fill="#64748B">, </tspan><tspan fill="#22C55E">&quot;Full-Stack TS&quot;</tspan><tspan fill="#64748B">];</tspan>
    </text>

    <!-- Marco HUD: corchetes de esquina -->
    <g fill="none" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.35;0.62;0.35" dur="4.5s" repeatCount="indefinite"/>
      <path d="M26 54 L26 34 Q26 26 34 26 L54 26"/>
      <path d="M1146 26 L1166 26 Q1174 26 1174 34 L1174 54"/>
      <path d="M1174 246 L1174 266 Q1174 274 1166 274 L1146 274"/>
      <path d="M54 274 L34 274 Q26 274 26 266 L26 246"/>
    </g>
  </g>
</svg>
