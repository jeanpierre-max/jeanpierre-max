<svg xmlns="http://www.w3.org/2000/svg" width="200" height="170" viewBox="0 0 200 170"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="AI Ops / Modular Arch / Integrations / Continuous Evo">
  <title>Reech AI &#183; right</title>
  <defs>
    <filter id="hl-right-glow-v" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#A855F7" flood-opacity="0.65"/>
    </filter>
    <filter id="hl-right-glow-c" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#38BDF8" flood-opacity="0.65"/>
    </filter>
    <filter id="hl-right-glow-g" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#22C55E" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Caja / tarjeta (igual que la racha) -->
  <rect x="2" y="2" width="196" height="166" rx="14" fill="#0D1117" stroke="#A855F7" stroke-opacity="0.22" stroke-width="1"/>

  <g>
    <animate attributeName="opacity" values="0.72;1;0.72" dur="5s" begin="-0s" repeatCount="indefinite"/>
    <rect x="24" y="20" width="152" height="26" rx="13"
          fill="#1E293B" fill-opacity="0.35" stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="40" cy="33" r="3" fill="#A855F7" filter="url(#hl-right-glow-v)">
      <animate attributeName="r" values="2.4;3.4;2.4" dur="3s" begin="-0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3s" begin="-0s" repeatCount="indefinite"/>
    </circle>
    <text x="54" y="37" font-family="'Cascadia Code','Consolas','Courier New',monospace"
          font-size="12" fill="#E2E8F0">AI Ops</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0.72;1;0.72" dur="5s" begin="-1.25s" repeatCount="indefinite"/>
    <rect x="24" y="55" width="152" height="26" rx="13"
          fill="#1E293B" fill-opacity="0.35" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="40" cy="68" r="3" fill="#38BDF8" filter="url(#hl-right-glow-c)">
      <animate attributeName="r" values="2.4;3.4;2.4" dur="3s" begin="-0.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3s" begin="-0.75s" repeatCount="indefinite"/>
    </circle>
    <text x="54" y="72" font-family="'Cascadia Code','Consolas','Courier New',monospace"
          font-size="12" fill="#E2E8F0">Modular Arch</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0.72;1;0.72" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
    <rect x="24" y="90" width="152" height="26" rx="13"
          fill="#1E293B" fill-opacity="0.35" stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="40" cy="103" r="3" fill="#A855F7" filter="url(#hl-right-glow-v)">
      <animate attributeName="r" values="2.4;3.4;2.4" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="54" y="107" font-family="'Cascadia Code','Consolas','Courier New',monospace"
          font-size="12" fill="#E2E8F0">Integrations</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0.72;1;0.72" dur="5s" begin="-3.75s" repeatCount="indefinite"/>
    <rect x="24" y="125" width="152" height="26" rx="13"
          fill="#1E293B" fill-opacity="0.35" stroke="#22C55E" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="40" cy="138" r="3" fill="#22C55E" filter="url(#hl-right-glow-g)">
      <animate attributeName="r" values="2.4;3.4;2.4" dur="3s" begin="-2.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3s" begin="-2.25s" repeatCount="indefinite"/>
    </circle>
    <text x="54" y="142" font-family="'Cascadia Code','Consolas','Courier New',monospace"
          font-size="12" fill="#E2E8F0">Continuous Evo</text>
  </g>
</svg>
