<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="460" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid meet" role="img">
  <title>Sobre m&#237; &#183; sesi&#243;n de terminal en vivo</title>

  <defs>
    <clipPath id="ab-clip">
      <rect x="0" y="0" width="1200" height="460" rx="18"/>
    </clipPath>

    <pattern id="ab-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>

    <pattern id="ab-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#F8FAFC"/>
    </pattern>

    <linearGradient id="ab-nameGrad" gradientUnits="userSpaceOnUse" x1="64" y1="122" x2="204" y2="122">
      <stop offset="0"   stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#D946EF"/>
      <stop offset="0.8" stop-color="#E879F9"/>
      <stop offset="1"   stop-color="#38BDF8"/>
    </linearGradient>

    <radialGradient id="ab-glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ab-glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#A855F7" stop-opacity="0.12"/>
      <stop offset="0.7" stop-color="#D946EF" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ab-sweepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="1"   stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <filter id="ab-textglow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#A855F7" flood-opacity="0.5"/>
    </filter>

    <filter id="ab-lineglow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#A855F7" flood-opacity="0.65"/>
    </filter>

    <path id="ab-orbit" d="M 830 230 a 120 120 0 1 0 240 0 a 120 120 0 1 0 -240 0"/>

    <!-- Reveals de tipeo (un clip por comando, ancho discreto por caracter) -->
    <clipPath id="ab-t1">
      <rect x="248" y="74" height="24" width="0">
        <animate attributeName="width" dur="20s" repeatCount="indefinite" calcMode="discrete"
                 values="0;9.6;19.2;28.8;38.4;48;70"
                 keyTimes="0;0.034;0.0405;0.047;0.0535;0.06;0.0665"/>
      </rect>
    </clipPath>
    <clipPath id="ab-t2">
      <rect x="248" y="138" height="24" width="0">
        <animate attributeName="width" dur="20s" repeatCount="indefinite" calcMode="discrete"
                 values="0;9.6;19.2;28.8;38.4;48;57.6;67.2;76.8;86.4;96;105.6;115.2;138"
                 keyTimes="0;0.1365;0.143;0.1495;0.156;0.1625;0.169;0.1755;0.182;0.1885;0.195;0.2015;0.208;0.2145"/>
      </rect>
    </clipPath>
    <clipPath id="ab-t3">
      <rect x="248" y="202" height="24" width="0">
        <animate attributeName="width" dur="20s" repeatCount="indefinite" calcMode="discrete"
                 values="0;9.6;19.2;28.8;38.4;48;57.6;67.2;76.8;86.4;96;118"
                 keyTimes="0;0.284;0.2905;0.297;0.3035;0.31;0.3165;0.323;0.3295;0.336;0.3425;0.349"/>
      </rect>
    </clipPath>
    <clipPath id="ab-t4">
      <rect x="248" y="266" height="24" width="0">
        <animate attributeName="width" dur="20s" repeatCount="indefinite" calcMode="discrete"
                 values="0;9.6;19.2;28.8;38.4;48;57.6;67.2;76.8;86.4;96;105.6;115.2;124.8;148"
                 keyTimes="0;0.419;0.4255;0.432;0.4385;0.445;0.4515;0.458;0.4645;0.471;0.4775;0.484;0.4905;0.497;0.5035"/>
      </rect>
    </clipPath>
    <clipPath id="ab-t5">
      <rect x="248" y="330" height="24" width="0">
        <animate attributeName="width" dur="20s" repeatCount="indefinite" calcMode="discrete"
                 values="0;9.6;19.2;28.8;38.4;48;57.6;67.2;76.8;86.4;96;105.6;115.2;138"
                 keyTimes="0;0.574;0.5805;0.587;0.5935;0.6;0.6065;0.613;0.6195;0.626;0.6325;0.639;0.6455;0.652"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#ab-clip)">
    <!-- Fondo -->
    <rect x="0" y="0" width="1200" height="460" rx="18" fill="#0D1117"/>
    <rect x="0" y="0" width="1200" height="460" fill="url(#ab-grid)" opacity="0.55"/>
    <rect x="0" y="0" width="1200" height="460" fill="url(#ab-scan)" opacity="0.025"/>

    <!-- Glows ambientales -->
    <ellipse cx="330" cy="230" rx="380" ry="210" fill="url(#ab-glowL)"/>
    <circle cx="950" cy="240" r="230" fill="url(#ab-glowR)"/>

    <!-- Barrido vertical tenue -->
    <rect x="0" y="-140" width="1200" height="140" fill="url(#ab-sweepGrad)" opacity="0.06">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 640" dur="13s" repeatCount="indefinite"/>
    </rect>

    <!-- Acento orbital (eco del hero, lado derecho libre de texto) -->
    <circle cx="950" cy="230" r="120" fill="none" stroke="#A855F7"
            stroke-width="1" stroke-dasharray="3 9" opacity="0.12"/>
    <circle r="2.5" fill="#E879F9" opacity="0.55" filter="url(#ab-lineglow)">
      <animateMotion dur="14s" repeatCount="indefinite" rotate="0">
        <mpath xlink:href="#ab-orbit"/>
      </animateMotion>
    </circle>

    <!-- Microparticulas violeta -->
    <g fill="#C4B5FD">
      <circle cx="742" cy="96" r="1.4">
        <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1118" cy="118" r="1.2" fill="#38BDF8">
        <animate attributeName="opacity" values="0.75;0.2;0.75" dur="4.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="836" cy="392" r="1.3">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.9s" begin="-1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1142" cy="350" r="1.1" fill="#38BDF8">
        <animate attributeName="opacity" values="0.25;0.8;0.25" dur="3.8s" begin="-2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1056" cy="206" r="1.2">
        <animate attributeName="opacity" values="0.8;0.25;0.8" dur="3.1s" begin="-0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="918" cy="84" r="1.2" fill="#E879F9">
        <animate attributeName="opacity" values="0.3;0.85;0.3" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Etiquetas HUD -->
    <text x="64" y="52" fill="#A855F7"
          font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="15">~/about</text>
    <circle cx="978" cy="47" r="3" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="1136" y="52" text-anchor="end" fill="#64748B"
          font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="15">// live session</text>

    <!-- ===================== SESION DE TERMINAL (bucle 20s) ===================== -->
    <g font-family="'Cascadia Code','Consolas','Courier New',monospace" font-size="16">
      <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
               values="1;1;0;0" keyTimes="0;0.91;0.95;1"/>

      <!-- L1: $ whoami -->
      <text x="64" y="92" opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
                 values="0;0;1;1" keyTimes="0;0.013;0.018;1"/>
        <tspan fill="#A855F7">~/jeanpierre-max</tspan><tspan fill="#22C55E"> $</tspan>
      </text>
      <text x="248" y="92" fill="#F8FAFC" clip-path="url(#ab-t1)">whoami</text>
      <g opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                 values="0;1;0" keyTimes="0;0.015;0.0725"/>
        <rect x="248" y="79" width="9" height="17" fill="#A855F7">
          <animate attributeName="x" dur="20s" repeatCount="indefinite" calcMode="discrete"
                   values="248;257.6;267.2;276.8;286.4;296;305.6"
                   keyTimes="0;0.034;0.0405;0.047;0.0535;0.06;0.0665"/>
        </rect>
      </g>

      <!-- L2: salida whoami -->
      <g opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
                 values="0;0;1;1" keyTimes="0;0.08;0.095;1"/>
        <animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite"
                          values="0 5;0 5;0 0;0 0" keyTimes="0;0.08;0.095;1"/>
        <text x="64" y="122" fill="url(#ab-nameGrad)" font-weight="bold"
              filter="url(#ab-textglow)">Jean Pierre FM</text>
        <text x="204" y="122"><tspan fill="#64748B">&#8212;</tspan><tspan fill="#C4B5FD">  Full-Stack Dev Jr</tspan><tspan fill="#64748B"> @ </tspan><tspan fill="#38BDF8">Reech AI</tspan></text>
      </g>

      <!-- L3: $ cat focus.txt -->
      <text x="64" y="156" opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
                 values="0;0;1;1" keyTimes="0;0.113;0.119;1"/>
        <tspan fill="#A855F7">~/jeanpierre-max</tspan><tspan fill="#22C55E"> $</tspan>
      </text>
      <text x="248" y="156" fill="#F8FAFC" clip-path="url(#ab-t2)">cat focus.txt</text>
      <g opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                 values="0;1;0" keyTimes="0;0.115;0.22"/>
        <rect x="248" y="143" width="9" height="17" fill="#A855F7">
          <animate attributeName="x" dur="20s" repeatCount="indefinite" calcMode="discrete"
                   values="248;257.6;267.2;276.8;286.4;296;305.6;315.2;324.8;334.4;344;353.6;363.2;372.8"
                   keyTimes="0;0.1365;0.143;0.1495;0.156;0.1625;0.169;0.1755;0.182;0.1885;0.195;0.2015;0.208;0.2145"/>
        </rect>
      </g>

      <!-- L4: salida focus -->
      <g opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
                 values="0;0;1;1" keyTimes="0;0.2275;0.2425;1"/>
        <animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite"
                          values="0 5;0 5;0 0;0 0" keyTimes="0;0.2275;0.2425;1"/>
        <text x="64" y="186"><tspan fill="#E879F9">Apps con IA</tspan><tspan fill="#64748B">  &#183;  </tspan><tspan fill="#38BDF8">Edge Backends</tspan><tspan fill="#64748B">  &#183;  </tspan><tspan fill="#C4B5FD">Full-Stack TS</tspan></text>
      </g>

      <!-- L5: $ ls ~/skills -->
      <text x="64" y="220" opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
                 values="0;0;1;1" keyTimes="0;0.2615;0.2675;1"/>
        <tspan fill="#A855F7">~/jeanpierre-max</tspan><tspan fill="#22C55E"> $</tspan>
      </text>
      <text x="248" y="220" clip-path="url(#ab-t3)"><tspan fill="#F8FAFC">ls </tspan><tspan fill="#C4B5FD">~/skills</tspan></text>
      <g opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                 values="0;1;0" keyTimes="0;0.2625;0.355"/>
        <rect x="248" y="207" width="9" height="17" fill="#A855F7">
          <animate attributeName="x" dur="20s" repeatCount="indefinite" calcMode="discrete"
                   values="248;257.6;267.2;276.8;286.4;296;305.6;315.2;324.8;334.4;344;353.6"
                   keyTimes="0;0.284;0.2905;0.297;0.3035;0.31;0.3165;0.323;0.3295;0.336;0.3425;0.349"/>
        </rect>
      </g>

      <!-- L6: salida skills -->
      <g opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
                 values="0;0;1;1" keyTimes="0;0.3625;0.3775;1"/>
        <animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite"
                          values="0 5;0 5;0 0;0 0" keyTimes="0;0.3625;0.3775;1"/>
        <text x="64" y="250"><tspan fill="#38BDF8">NestJS/</tspan><tspan fill="#C4B5FD">  Hono/</tspan><tspan fill="#38BDF8">  LangGraph/</tspan><tspan fill="#C4B5FD">  React-Native/</tspan><tspan fill="#38BDF8">  Supabase/</tspan><tspan fill="#C4B5FD">  GCP/</tspan></text>
      </g>

      <!-- L7: $ echo $LOCATION -->
      <text x="64" y="284" opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
                 values="0;0;1;1" keyTimes="0;0.3965;0.4025;1"/>
        <tspan fill="#A855F7">~/jeanpierre-max</tspan><tspan fill="#22C55E"> $</tspan>
      </text>
      <text x="248" y="284" clip-path="url(#ab-t4)"><tspan fill="#F8FAFC">echo </tspan><tspan fill="#C4B5FD">$LOCATION</tspan></text>
      <g opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                 values="0;1;0" keyTimes="0;0.3975;0.51"/>
        <rect x="248" y="271" width="9" height="17" fill="#A855F7">
          <animate attributeName="x" dur="20s" repeatCount="indefinite" calcMode="discrete"
                   values="248;257.6;267.2;276.8;286.4;296;305.6;315.2;324.8;334.4;344;353.6;363.2;372.8;382.4"
                   keyTimes="0;0.419;0.4255;0.432;0.4385;0.445;0.4515;0.458;0.4645;0.471;0.4775;0.484;0.4905;0.497;0.5035"/>
        </rect>
      </g>

      <!-- L8: salida LOCATION -->
      <g opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
                 values="0;0;1;1" keyTimes="0;0.5175;0.5325;1"/>
        <animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite"
                          values="0 5;0 5;0 0;0 0" keyTimes="0;0.5175;0.5325;1"/>
        <text x="64" y="314"><tspan fill="#C4B5FD">Chimbote, Per&#250;</tspan><tspan fill="#64748B"> (UTC-5)</tspan></text>
      </g>

      <!-- L9: $ echo $MISSION -->
      <text x="64" y="348" opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
                 values="0;0;1;1" keyTimes="0;0.5515;0.5575;1"/>
        <tspan fill="#A855F7">~/jeanpierre-max</tspan><tspan fill="#22C55E"> $</tspan>
      </text>
      <text x="248" y="348" clip-path="url(#ab-t5)"><tspan fill="#F8FAFC">echo </tspan><tspan fill="#C4B5FD">$MISSION</tspan></text>
      <g opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                 values="0;1;0" keyTimes="0;0.5525;0.6575"/>
        <rect x="248" y="335" width="9" height="17" fill="#A855F7">
          <animate attributeName="x" dur="20s" repeatCount="indefinite" calcMode="discrete"
                   values="248;257.6;267.2;276.8;286.4;296;305.6;315.2;324.8;334.4;344;353.6;363.2;372.8"
                   keyTimes="0;0.574;0.5805;0.587;0.5935;0.6;0.6065;0.613;0.6195;0.626;0.6325;0.639;0.6455;0.652"/>
        </rect>
      </g>

      <!-- L10: salida MISSION -->
      <g opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
                 values="0;0;1;1" keyTimes="0;0.665;0.68;1"/>
        <animateTransform attributeName="transform" type="translate" dur="20s" repeatCount="indefinite"
                          values="0 5;0 5;0 0;0 0" keyTimes="0;0.665;0.68;1"/>
        <text x="64" y="378" fill="#22C55E">&quot;Convertir problemas complejos en productos con IA.&quot;</text>
      </g>

      <!-- L11: prompt final con cursor parpadeante -->
      <text x="64" y="412" opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite"
                 values="0;0;1;1" keyTimes="0;0.698;0.705;1"/>
        <tspan fill="#A855F7">~/jeanpierre-max</tspan><tspan fill="#22C55E"> $</tspan>
      </text>
      <g opacity="0">
        <animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete"
                 values="0;1" keyTimes="0;0.7"/>
        <rect x="248" y="399" width="9" height="17" fill="#A855F7">
          <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Marco HUD: corchetes de esquina -->
    <g fill="none" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.35;0.62;0.35" dur="4.5s" repeatCount="indefinite"/>
      <path d="M26 54 L26 34 Q26 26 34 26 L54 26"/>
      <path d="M1146 26 L1166 26 Q1174 26 1174 34 L1174 54"/>
      <path d="M1174 406 L1174 426 Q1174 434 1166 434 L1146 434"/>
      <path d="M54 434 L34 434 Q26 434 26 426 L26 406"/>
    </g>
  </g>
</svg>
